[extend]
useDefault = true

# Release builds receive the dashboard API credential from the environment.
[[rules]]
id = "dtt-dashboard-api-credential"
description = "DTT dashboard API credential committed as a build flag"
regex = '''RAD_PUBLIC_KEY="\\"([A-Za-z0-9+/_-]{16,}={0,2})\\""'''
secretGroup = 1
keywords = ["rad_public_key"]

# The provenance test vector is a JWS signed by a throwaway key whose private
# half was destroyed (see AGENTS.md); its history includes the earlier vector.
# Only the jwt rule is waived, and only for this file.
[[allowlists]]
description = "Published non-secret ES256 provenance test vector"
targetRules = ["jwt"]
paths = ['''^\.github/scripts/firmware_provenance_test_vector\.json$''']
