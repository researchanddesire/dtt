; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = development

[common]
extra_scripts = pre:pre_build_script.py, pre:generate_migration_assets.py, pre:firmware_build_metadata.py
board_build.partitions = partition-v2.csv
build_src_filter =
    +<*>
    -<migration/>
lib_deps =
    rlogiacco/CircularBuffer@1.4.0
    mathertel/OneButton@2.6.1
    fastled/FastLED@3.10.2
    bblanchon/ArduinoJson@7.4.2
    olikraus/U8g2@2.36.12
    ricmoo/QRCode@0.0.1
    ; WiFiManager is vendored in lib/WiFiManager and pinned by this repository.
    TrainingTypes
build_unflags =
    -std=gnu++11
    -fexceptions
    -flto
build_flags =
    -fno-exceptions
upload_speed = 921600
monitor_speed = 115200
monitor_filters = colorize, esp32_exception_decoder, time
check_skip_packages = true
check_tool = clangtidy
check_flags =
    clangtidy: --fix --checks=-\*,bugprone-*,boost-*,modernize-*,performance-*,clang-analyzer-*,cert-dcl03-c,cert-dcl21-cpp,cert-dcl58-cpp,cert-err34-c,cert-err52-cpp,cert-err58-cpp,cert-err60-cpp,cert-flp30-c,cert-msc50-cpp,cert-msc51-cpp,cert-oop54-cpp,cert-str34-c,cppcoreguidelines-interfaces-global-init,cppcoreguidelines-narrowing-conversions,cppcoreguidelines-pro-type-member-init,cppcoreguidelines-pro-type-static-cast-downcast,cppcoreguidelines-slicing,google-default-arguments,google-explicit-constructor,google-runtime-operator,hicpp-exception-baseclass,hicpp-multiway-paths-covered,hicpp-signed-bitwise,portability-simd-intrinsics,readability-avoid-const-params-in-decls,readability-const-return-type,readability-container-size-empty,readability-convert-member-functions-to-static,readability-delete-null-pointer,readability-deleted-default,readability-inconsistent-declaration-parameter-name,readability-make-member-function-const,readability-misleading-indentation,readability-misplaced-array-index,readability-non-const-parameter,readability-redundant-control-flow,readability-redundant-declaration,readability-redundant-function-ptr-dereference,readability-redundant-smartptr-get,readability-simplify-subscript-expr,readability-static-accessed-through-instance,readability-static-definition-in-anonymous-namespace,readability-string-compare,readability-uniqueptr-delete-release,readability-use-anyofallof,-modernize-use-trailing-return-type,-bugprone-easily-swappable-parameters,-modernize-avoid-c-arrays,-readability-redundant-declaration,-clang-diagnostic-c2x-extensions,-bugprone-branch-clone

[env:development]
board_build.partitions = partition-dev.csv
lib_deps =
    ${common.lib_deps}
    https://github.com/researchanddesire/rad-ble.git#4af1c5f8cbcd94af651d3d34db65cf6a86966359
    h2zero/NimBLE-Arduino@2.4.0
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=4
    -Os
    -D FIRMWARE_TRACK="\"development\""
    -D DTT_ENABLE_RAD_BLE=1
    -D DTT_HARDWARE_VARIANT="\"v2\""
    -D RAD_PUBLIC_KEY="\"DEV_KEY_123\""
    -D NO_UPDATE
    ; -D FORCE_UPDATE
    -D RAD_SERVER="\"http://localhost:3000\""
    -D BYPASS_PLAY
    -D VERSIONDEV
    -D BYPASS_EEPROM
    ; -D AUTOPLAY_FOR_VIDEO
    ; -D DEBUG_GO_STRAIGHT_TO_PLAY
extends = common
board = esp32dev
platform = espressif32@6.12.0
framework = arduino
targets = upload, monitor
test_build_src = true


[provision_common]
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=4
    -Os
    -D DTT_ENABLE_RAD_BLE=0
    -D DTT_HARDWARE_VARIANT="\"v2\""
    -D PROVISION
lib_ignore =
    FastLED
    CircularBuffer
    TrainingTypes
lib_deps =
    ${common.lib_deps}
build_src_filter =
    +<*>
    -<migration/>
    -<pages/play/>
    -<pages/welcome/>

[env:provision-development]
board_build.partitions = partition-dev.csv
build_flags =
    ${provision_common.build_flags}
    -D RAD_SERVER="\"http://localhost:3000\""
    -D RAD_PUBLIC_KEY="\"DEV_KEY_123\""
    -D VERSIONDEV
extends = common, provision_common
board = esp32dev
platform = espressif32@6.12.0
framework = arduino
targets = upload, monitor


[env:staging-v1]
custom_rad_public_key = environment
; CORE_DEBUG_LEVEL=0 omits error logs; do not link unused TLS error text.
; Certificate verification and numeric error return values remain unchanged.
custom_omit_unused_tls_error_text = yes
board_build.partitions = partition-v1.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    ${common.build_flags}
    -std=gnu++17
    ; Keep staging release artifacts size-equivalent to production.
    -D CORE_DEBUG_LEVEL=0
    -Os
    -D FIRMWARE_USE_IDF_CRT_BUNDLE
    -D FIRMWARE_TRACK="\"staging\""
    -D DTT_ENABLE_RAD_BLE=0
    -D DTT_HARDWARE_VARIANT="\"v1\""
    -D RAD_SERVER="\"https://staging.researchanddesire.com\""
extends = common
board = esp32dev
platform = espressif32@6.12.0
framework = arduino
test_build_src = true

[env:staging-v2]
custom_rad_public_key = environment
; Bound pending BLE commands to leave TLS heap on the non-PSRAM Trainer.
; Message sizes, characteristics, leases and queue-full replies are unchanged.
custom_radble_queue_depth = 4
custom_radble_stack_bytes = 8192
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.staging-v2.defaults"
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.staging-v2
board_build.partitions = partition-v2.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps =
    ${common.lib_deps}
    https://github.com/researchanddesire/rad-ble.git#4af1c5f8cbcd94af651d3d34db65cf6a86966359
    h2zero/NimBLE-Arduino@2.4.0
build_flags =
    ${common.build_flags}
    -std=gnu++17
    ; Keep staging release artifacts size-equivalent to production.
    -D CORE_DEBUG_LEVEL=0
    -Os
    -D FIRMWARE_USE_IDF_CRT_BUNDLE
    -D FIRMWARE_TRACK="\"staging\""
    -D DTT_ENABLE_RAD_BLE=1
    -D DTT_HARDWARE_VARIANT="\"v2\""
    -D RAD_SERVER="\"https://staging.researchanddesire.com\""
    ; The bench uses one BLE client and this product never scans or initiates BLE.
    ; Leave controller/host connection pools available to certificate-checked TLS.
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -Wno-error=unknown-pragmas
    -Wno-unknown-pragmas
extends = common
board = esp32dev
platform = espressif32@6.12.0
framework = arduino, espidf
test_build_src = true

[env:production-v1]
custom_rad_public_key = environment
; Match staging-v1: disabled error logs must not retain unused TLS error text.
; Certificate verification and numeric error return values remain unchanged.
custom_omit_unused_tls_error_text = yes
board_build.partitions = partition-v1.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
    -Os
    -D FIRMWARE_USE_IDF_CRT_BUNDLE
    -D FIRMWARE_TRACK="\"main\""
    -D DTT_ENABLE_RAD_BLE=0
    -D DTT_HARDWARE_VARIANT="\"v1\""
    -D RAD_SERVER="\"https://dashboard.researchanddesire.com\""
extends = common
board = esp32dev
platform = espressif32@6.12.0
framework = arduino

[env:production-v2]
custom_rad_public_key = environment
board_build.partitions = partition-v2.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps =
    ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
    -Os
    -D FIRMWARE_USE_IDF_CRT_BUNDLE
    -D FIRMWARE_TRACK="\"main\""
    -D DTT_ENABLE_RAD_BLE=0
    -D DTT_HARDWARE_VARIANT="\"v2\""
    -D RAD_SERVER="\"https://dashboard.researchanddesire.com\""
extends = common
board = esp32dev
platform = espressif32@6.12.0
framework = arduino

; Compatibility aliases remain permanently pinned to the safe V1 lane.
[env:staging]
extends = env:staging-v1

[env:production]
extends = env:production-v1

[migration_common]
board_build.partitions = partition-v1.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter =
    -<*>
    +<migration/main.cpp>
    +<services/eeprom_service.cpp>
    +<services/dhcp_server_patch.c>
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -Os
    -D FIRMWARE_USE_IDF_CRT_BUNDLE
    -D DTT_ENABLE_RAD_BLE=0
    -D DTT_HARDWARE_VARIANT="\"v2\""
lib_deps =
    bblanchon/ArduinoJson@7.4.2

[env:migration-staging]
extends = common, migration_common
build_flags =
    ${migration_common.build_flags}
    -D CORE_DEBUG_LEVEL=2
    -D FIRMWARE_TRACK="\"staging\""
    -D RAD_SERVER="\"https://staging.researchanddesire.com\""
board = esp32dev
platform = espressif32@6.12.0
framework = arduino

[env:migration-production]
extends = common, migration_common
build_flags =
    ${migration_common.build_flags}
    -D CORE_DEBUG_LEVEL=0
    -D FIRMWARE_TRACK="\"main\""
    -D RAD_SERVER="\"https://dashboard.researchanddesire.com\""
board = esp32dev
platform = espressif32@6.12.0
framework = arduino

[env:provision-repair]
custom_rad_public_key = environment
build_flags =
    ${provision_common.build_flags}
    -D RAD_SERVER="\"https://dashboard.researchanddesire.com\""
extends = common, provision_common
board = esp32dev
platform = espressif32@6.12.0
framework = arduino
targets = upload, monitor


[env:provision-staging]
custom_rad_public_key = environment
board_build.partitions = partition-v2.csv
build_flags =
    ${provision_common.build_flags}
    -D FIRMWARE_TRACK="\"staging\""
    -D RAD_SERVER="\"https://staging.researchanddesire.com\""
extends = common, provision_common
board = esp32dev
platform = espressif32@6.12.0
framework = arduino


[env:provision]
custom_rad_public_key = environment
build_flags =
    ${provision_common.build_flags}
    -D RAD_SERVER="\"https://dashboard.researchanddesire.com\""
extends = common, provision_common
board = esp32dev
platform = espressif32@6.12.0
framework = arduino
targets = upload, monitor

[env:test_native]
platform = native@1.2.1
extra_scripts = pre:firmware_build_metadata.py
lib_deps =
    bblanchon/ArduinoJson@7.4.2
build_flags =
    -std=gnu++17
    -D FIRMWARE_TRACK="\"test\""
test_filter = test_firmware_metadata, test_firmware_update_protocol, test_session_security
build_unflags = -std=gnu++11

; Explicitly local, non-release environments for wired OTA migration
; validation. Build commands must supply RAD_SERVER through
; PLATFORMIO_BUILD_FLAGS. The insecure transport flag is absent from every
; staging and production environment.
[lab_ota_application]
build_flags =
    ${common.build_flags}
    -std=gnu++17
    ; Keep the V1 lab image inside the deployed 0x140000-byte OTA slot.
    ; Explicit DTT_LAB_* markers provide the hardware-test evidence.
    -D CORE_DEBUG_LEVEL=0
    -Os
    -D FIRMWARE_TRACK="\"main\""
    -D DTT_MIGRATION_LAB_INSECURE_HTTP=1
    -D DTT_MIGRATION_LAB_AUTORUN=1
    -D RAD_PUBLIC_KEY="\"DEV_KEY_123\""

[env:lab-ota-v1]
extends = common, lab_ota_application
board_build.partitions = partition-v1.csv
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
build_flags =
    ${lab_ota_application.build_flags}
    -D DTT_ENABLE_RAD_BLE=0
    -D DTT_HARDWARE_VARIANT="\"v1\""
board = esp32dev
platform = espressif32@6.12.0
framework = arduino

[env:lab-ota-v2]
extends = common, lab_ota_application
board_build.partitions = partition-v2.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
lib_deps =
    ${common.lib_deps}
    https://github.com/researchanddesire/rad-ble.git#4af1c5f8cbcd94af651d3d34db65cf6a86966359
    h2zero/NimBLE-Arduino@2.4.0
build_flags =
    ${lab_ota_application.build_flags}
    -D DTT_ENABLE_RAD_BLE=1
    -D DTT_HARDWARE_VARIANT="\"v2\""
board = esp32dev
platform = espressif32@6.12.0
framework = arduino

[env:migration-lab]
extends = common, migration_common
build_flags =
    ${migration_common.build_flags}
    -D CORE_DEBUG_LEVEL=2
    -D FIRMWARE_TRACK="\"main\""
    -D DTT_MIGRATION_LAB_INSECURE_HTTP=1
    ; Gives wired inspection time after the new bootloader is active but
    ; before the legacy partition table is replaced. Never set in release.
    -D DTT_MIGRATION_LAB_BOOTLOADER_CHECKPOINT_MS=30000
board = esp32dev
platform = espressif32@6.12.0
framework = arduino

[env:development-v1]
extends = env:staging-v1
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
    -Os
    -D FIRMWARE_USE_IDF_CRT_BUNDLE
    -D FIRMWARE_TRACK="\"development\""
    -D DTT_ENABLE_RAD_BLE=0
    -D DTT_HARDWARE_VARIANT="\"v1\""
    -D VERSIONDEV
    -D NO_UPDATE

[env:development-v2]
extends = env:staging-v2
build_flags =
    ${common.build_flags}
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=0
    -Os
    -D FIRMWARE_USE_IDF_CRT_BUNDLE
    -D FIRMWARE_TRACK="\"development\""
    -D DTT_ENABLE_RAD_BLE=1
    -D DTT_HARDWARE_VARIANT="\"v2\""
    ; The bench uses one BLE client and this product never scans or initiates BLE.
    ; Leave controller/host connection pools available to certificate-checked TLS.
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -Wno-error=unknown-pragmas
    -Wno-unknown-pragmas
    -D VERSIONDEV
    -D NO_UPDATE
board_build.esp-idf.sdkconfig_path = .pio/sdkconfig.development-v2
