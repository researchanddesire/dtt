name: Publish immutable firmware candidate

on:
  # Manual runs republish the current branch head after a failed candidate.
  workflow_dispatch:
  push:
    # Versions are allocated and candidates published only for merges into main.
    branches: [main]
    paths:
      # The firmware directory only: a change here allocates the next version and
      # publishes a signed candidate. Keep in sync with FIRMWARE_PATHS in
      # pr-firmware.yml and pr-target-policy.yml. Release tooling changes are
      # exercised by PR checks and republished manually.
      - "software/**"
      - "!software/scripts/hil/**"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: firmware-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  detect_auto_version:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    outputs:
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Detect current-track auto-version commit
        id: detect
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if python scripts/release_version.py is-auto-commit --message "$COMMIT_MESSAGE" --track "$GITHUB_REF_NAME"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: detect_auto_version
    if: ${{ needs.detect_auto_version.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'firmware-production' || 'firmware-staging' }}
    defaults:
      run:
        working-directory: software/firmware
    env:
      FIRMWARE_PUBLISH_TOKEN: ${{ secrets.FIRMWARE_PUBLISH_TOKEN }}
      FIRMWARE_PROVENANCE_SIGNING_KEY_PEM: ${{ secrets.FIRMWARE_PROVENANCE_SIGNING_KEY_PEM }}
      # Release builds embed the dashboard API credential; it is never committed.
      RAD_PUBLIC_KEY: ${{ secrets.RAD_PUBLIC_KEY }}
    steps:
      - name: Generate version-control token
        id: version_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RAD_VERSION_CONTROL_APP_ID }}
          private-key: ${{ secrets.RAD_VERSION_CONTROL_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.version_token.outputs.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select track and build environment
        run: python ../../.github/scripts/release_workflow.py configure --branch "$GITHUB_REF_NAME"

      - name: Resolve merged PR title
        id: pull_request
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            let title = "";
            try {
              const { data: pulls } =
                await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: context.sha,
                });
              title = pulls.find(
                (pull) =>
                  pull.merged_at !== null &&
                  pull.base.ref === process.env.GITHUB_REF_NAME,
              )?.title ?? "";
            } catch (error) {
              if (error.status !== 403) throw error;
              core.warning("PR title lookup unavailable; using the default patch bump");
            }
            core.setOutput("title", title);

      - name: Allocate and commit next version
        id: version
        working-directory: .
        env:
          PR_TITLE: ${{ steps.pull_request.outputs.title }}
          DEVICE_TYPE: dtt
          VERSION_HEADER: software/firmware/src/constants/Version.h
          RELEASE_VERSION: software/scripts/release_version.py
        run: bash .github/scripts/allocate_version.sh
      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Test publisher
        run: |
          python ../../.github/scripts/test_check_firmware_size.py
          python ../../.github/scripts/test_check_migration_image.py
          python ../../.github/scripts/test_build_web_installer.py
          python ../../.github/scripts/test_download_verified_release.py
          python ../../.github/scripts/test_firmware_provenance.py
          python ../../.github/scripts/test_publish_immutable_firmware.py
          python ../../.github/scripts/test_release_workflow.py

      - name: Run release helper tests
        run: python ../scripts/test_release_version.py

      - name: Run native unit tests
        run: pio test -e test_native

      - name: Build V1, V2, and migration bridge applications
        run: |
          pio run -e "$PIO_ENV_V1" -j 1
          pio run -e "$PIO_ENV_V2" -j 1
          pio run -e "$PIO_ENV_MIGRATION" -j 1

      - name: Verify each firmware fits its approved OTA partition
        run: |
          python ../../.github/scripts/check_firmware_size.py \
            --environment "$PIO_ENV_V1" \
            --partition partition-v1.csv \
            --partition-binary ".pio/build/$PIO_ENV_V1/partitions.bin" \
            --firmware ".pio/build/$PIO_ENV_V1/firmware.bin" \
            --expected-partition-blob 62778131c63221bcb0433e31ea5cde8eedc815f6 \
            --expected-partition-binary-sha256 148b959cbff1c38aa8e1d5c0ba9d612c54997b945e56a63f41223eef650653a1
          python ../../.github/scripts/check_firmware_size.py \
            --environment "$PIO_ENV_V2" \
            --partition partition-v2.csv \
            --partition-binary ".pio/build/$PIO_ENV_V2/partitions.bin" \
            --firmware ".pio/build/$PIO_ENV_V2/firmware.bin" \
            --expected-partition-blob 87b066320a83be1d390fd4cdfea9d1b5b6bccea4 \
            --expected-partition-binary-sha256 df8bb78d1134d502246d4ae7de59d397bc1d2529fa9c4affdd68aa78514e6c09
          python ../../.github/scripts/check_firmware_size.py \
            --environment "$PIO_ENV_MIGRATION" \
            --partition partition-v1.csv \
            --partition-binary ".pio/build/$PIO_ENV_MIGRATION/partitions.bin" \
            --firmware ".pio/build/$PIO_ENV_MIGRATION/firmware.bin" \
            --expected-partition-blob 62778131c63221bcb0433e31ea5cde8eedc815f6 \
            --expected-partition-binary-sha256 148b959cbff1c38aa8e1d5c0ba9d612c54997b945e56a63f41223eef650653a1
          python ../../.github/scripts/check_migration_image.py \
            --expected-flash-size-bytes 4194304 \
            ".pio/build/$PIO_ENV_V1/firmware.bin"
          python ../../.github/scripts/check_migration_image.py \
            --expected-flash-size-bytes 16777216 \
            ".pio/build/$PIO_ENV_V2/firmware.bin"
          python ../../.github/scripts/check_migration_image.py \
            --expected-flash-size-bytes 16777216 \
            ".pio/build/$PIO_ENV_MIGRATION/firmware.bin"

      - name: Build and validate V1 and V2 web installers
        run: |
          python ../../.github/scripts/build_web_installer.py \
            --profile esp32-4mb \
            --build-dir ".pio/build/$PIO_ENV_V1" \
            --output ".pio/build/$PIO_ENV_V1/web-installer.bin"
          python ../../.github/scripts/build_web_installer.py \
            --profile esp32-16mb \
            --build-dir ".pio/build/$PIO_ENV_V2" \
            --output ".pio/build/$PIO_ENV_V2/web-installer.bin"

      - name: Publish validating V1 release
        id: publish_v1
        run: |
          python ../../.github/scripts/publish_immutable_firmware.py \
            --device-type dtt \
            --hardware-variant v1 \
            --track "$TRACK" \
            --build-sha "$RELEASE_BUILD_SHA" \
            --version-file src/constants/Version.h \
            --kind firmware \
            --artifact "partitions:.pio/build/$PIO_ENV_V1/partitions.bin:1:false" \
            --artifact "application:.pio/build/$PIO_ENV_V1/firmware.bin:2:true" \
            --artifact "bootloader:.pio/build/$PIO_ENV_V1/bootloader.bin:3:false" \
            --artifact "web-installer:.pio/build/$PIO_ENV_V1/web-installer.bin:4:false"

      - name: Publish validating V2 release
        id: publish_v2
        run: |
          python ../../.github/scripts/publish_immutable_firmware.py \
            --device-type dtt \
            --hardware-variant v2 \
            --track "$TRACK" \
            --build-sha "$RELEASE_BUILD_SHA" \
            --version-file src/constants/Version.h \
            --kind firmware \
            --min-flash-size-bytes 16777216 \
            --artifact "partitions:.pio/build/$PIO_ENV_V2/partitions.bin:1:false" \
            --artifact "application:.pio/build/$PIO_ENV_V2/firmware.bin:2:true" \
            --artifact "bootloader:.pio/build/$PIO_ENV_V2/bootloader.bin:3:false" \
            --artifact "web-installer:.pio/build/$PIO_ENV_V2/web-installer.bin:4:false"

      - name: Publish validating migration bridge
        id: publish_migration
        run: |
          python ../../.github/scripts/publish_immutable_firmware.py \
            --device-type dtt \
            --hardware-variant v2 \
            --track "$TRACK" \
            --build-sha "$RELEASE_BUILD_SHA" \
            --version-file src/constants/Version.h \
            --kind migration \
            --min-flash-size-bytes 16777216 \
            --partition-layout legacy-v1 \
            --artifact "partitions:.pio/build/$PIO_ENV_MIGRATION/partitions.bin:1:false" \
            --artifact "application:.pio/build/$PIO_ENV_MIGRATION/firmware.bin:2:true" \
            --artifact "bootloader:.pio/build/$PIO_ENV_MIGRATION/bootloader.bin:3:false"

      - name: Candidate summary
        run: |
          echo "V1 release ${{ steps.publish_v1.outputs.release_id }} is waiting for hardware validation" >> "$GITHUB_STEP_SUMMARY"
          echo "V2 release ${{ steps.publish_v2.outputs.release_id }} was published to the V2 lane" >> "$GITHUB_STEP_SUMMARY"
          echo "Migration bridge release ${{ steps.publish_migration.outputs.release_id }} was published for allowlisted 16 MiB legacy-layout hardware" >> "$GITHUB_STEP_SUMMARY"
          echo "Version: ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Build: ${{ steps.version.outputs.release_build_sha }}" >> "$GITHUB_STEP_SUMMARY"
