name: Publish verified alpha alias

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: Validated staging release UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dtt-firmware-alias
  cancel-in-progress: false

jobs:
  alias:
    runs-on: ubuntu-latest
    environment: firmware-staging
    env:
      FIRMWARE_PUBLISH_TOKEN: ${{ secrets.FIRMWARE_PUBLISH_TOKEN }}
      FIRMWARE_CONTROL_PLANE_BASE_URL: https://staging.researchanddesire.com
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # rad-app reads every DTT alias from the production project.
      SUPABASE_PROJECT_ID: acjajruwevyyatztbkdf
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Supabase alias access
        run: supabase storage ls "ss:///dtt-firmware/" --experimental

      - name: Download and verify immutable release
        id: release
        run: |
          python .github/scripts/download_verified_release.py \
            --release-id "${{ inputs.release_id }}" \
            --track staging \
            --device dtt \
            --hardware-variant v1 \
            --output firmware
          test -f firmware/firmware.bin
          test -f firmware/version.json

      - name: Replace alpha Supabase alias
        run: |
          supabase storage rm "ss:///dtt-firmware/alpha/firmware.bin" "ss:///dtt-firmware/alpha/partitions.bin" \
            "ss:///dtt-firmware/alpha/bootloader.bin" "ss:///dtt-firmware/alpha/version.json" --experimental --yes || true
          for binary in firmware.bin partitions.bin bootloader.bin; do
            [[ ! -f "./firmware/$binary" ]] || supabase storage cp "./firmware/$binary" "ss:///dtt-firmware/alpha/$binary" \
              --content-type "application/octet-stream" --cache-control "no-cache" --experimental
          done
          supabase storage cp ./firmware/version.json "ss:///dtt-firmware/alpha/version.json" \
            --content-type "application/json" --cache-control "no-cache" --experimental

      - name: Summary
        run: echo "alpha now points to validated release ${{ inputs.release_id }} (v${{ steps.release.outputs.version }})" >> "$GITHUB_STEP_SUMMARY"
