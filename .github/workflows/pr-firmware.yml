name: PR firmware validation
on:
  pull_request:
    branches: [staging, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
env:
  RELEASE_BUILD_SHA: ${{ github.sha }}
jobs:
  development_screens:
    name: Development screen ${{ matrix.environment }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        environment: [development-v1, development-v2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - run: python -m unittest discover -s scripts -p 'test_capture_screen.py'
      - run: python -m unittest discover -s scripts -p 'test_serial_identity.py'
      - name: Compile development display capture (never upload)
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: pio run -e "$PIO_ENV" -t buildprog -j 2
      - name: Verify development console inclusion
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: python scripts/check_screen_build.py --build-dir "./.pio/build/$PIO_ENV" --expect enabled
  harness_tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/hil/requirements.txt
      - run: python -m unittest discover -s scripts/hil -p 'test_*.py'
      - run: python scripts/test_ble_memory.py
      - run: python scripts/test_tls_log_size.py
  firmware:
    name: Firmware ${{ matrix.environment }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging-v1
            track: staging
            variant: v1
          - environment: staging-v2
            track: staging
            variant: v2
          - environment: production-v1
            track: production
            variant: v1
          - environment: production-v2
            track: production
            variant: v2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install platformio==6.2.0
      - name: Build firmware
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: pio run -e "$PIO_ENV" -j 2
      - name: Verify development console inclusion
        env:
          PIO_ENV: ${{ matrix.environment }}
        run: python scripts/check_screen_build.py --build-dir "./.pio/build/$PIO_ENV" --expect disabled
      - name: Verify approved OTA layout and release headroom
        # Preserve the existing release gate before publishing hardware bundles.
        env:
          PIO_ENV: ${{ matrix.environment }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "v1" ]; then
            partition_blob=62778131c63221bcb0433e31ea5cde8eedc815f6
            partition_sha256=148b959cbff1c38aa8e1d5c0ba9d612c54997b945e56a63f41223eef650653a1
          else
            partition_blob=87b066320a83be1d390fd4cdfea9d1b5b6bccea4
            partition_sha256=df8bb78d1134d502246d4ae7de59d397bc1d2529fa9c4affdd68aa78514e6c09
          fi
          python ../.github/scripts/check_firmware_size.py \
            --environment "$PIO_ENV" --partition "partition-$VARIANT.csv" \
            --partition-binary ".pio/build/$PIO_ENV/partitions.bin" \
            --firmware ".pio/build/$PIO_ENV/firmware.bin" \
            --expected-partition-blob "$partition_blob" \
            --expected-partition-binary-sha256 "$partition_sha256"
      - name: Package the exact staging images
        if: matrix.track == 'staging'
        env:
          PIO_ENV: ${{ matrix.environment }}
          VARIANT: ${{ matrix.variant }}
        run: >-
          python scripts/hil/bundle.py --repository "$GITHUB_REPOSITORY"
          --build-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --variant "$VARIANT" --build-dir "./.pio/build/$PIO_ENV" --output hardware-parts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.track == 'staging'
        with:
          name: hardware-parts-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.variant }}
          path: software/hardware-parts/
          if-no-files-found: error
          retention-days: 14
  prepare_hardware:
    needs: firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: software
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hardware-parts-${{ github.sha }}-${{ github.run_attempt }}-*
          merge-multiple: true
          path: software/hardware-bundle
      - name: Verify every staging variant belongs to this run
        run: >-
          python scripts/hil/bundle.py --merge --repository "$GITHUB_REPOSITORY"
          --build-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          --output hardware-bundle
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardware-firmware-${{ github.sha }}-${{ github.run_attempt }}
          path: software/hardware-bundle/
          if-no-files-found: error
          retention-days: 14
  build_required:
    name: Build validation
    if: always()
    needs: [harness_tests, firmware, prepare_hardware, development_screens]
    runs-on: ubuntu-latest
    steps:
      - name: Require every build and manifest validation
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          failed = [name for name, job in json.loads(os.environ['RESULTS']).items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Required jobs did not pass: ' + ', '.join(failed))
          PY
  hardware:
    needs: build_required
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Use the exact reviewed wrapper commit allowed by the runner group.
    # Runner-group access is restricted to this full workflow path and ref.
    uses: researchanddesire/Open-Source-Deepthroat-Trainer_DTT/.github/workflows/hardware-run.yml@bfa30392c62ac9bc1f24a423d2f0245a11915c9c
  hardware_required:
    name: Hardware validation
    if: always()
    needs: [build_required, hardware]
    runs-on: ubuntu-latest
    steps:
      - name: Reject skipped, missing, cancelled, or failed hardware validation
        env:
          BUILD_RESULT: ${{ needs.build_required.result }}
          HARDWARE_RESULT: ${{ needs.hardware.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$HARDWARE_RESULT" = success
  test:
    # Preserve the former required check name, now backed by this run's devices.
    if: always()
    needs: hardware_required
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULT: ${{ needs.hardware_required.result }}
        run: test "$RESULT" = success
