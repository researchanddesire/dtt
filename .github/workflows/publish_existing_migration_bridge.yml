name: Publish existing DTT migration bridge

on:
  workflow_dispatch:
    inputs:
      release_build_sha:
        description: Firmware source commit in this repository to publish
        required: true
        type: string
      version:
        description: Numeric firmware version contained in that source commit
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: firmware-production
    env:
      FIRMWARE_PUBLISH_TOKEN: ${{ secrets.FIRMWARE_PUBLISH_TOKEN }}
      FIRMWARE_PROVENANCE_SIGNING_KEY_PEM: ${{ secrets.FIRMWARE_PROVENANCE_SIGNING_KEY_PEM }}
      RELEASE_BUILD_SHA: ${{ inputs.release_build_sha }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout exact firmware source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_build_sha }}
          path: firmware-source
          fetch-depth: 1

      - name: Locate the firmware project in that source
        # Sources before the software/firmware layout keep PlatformIO in software/.
        run: |
          if [ -f firmware-source/software/firmware/platformio.ini ]; then
            echo "FIRMWARE_DIR=firmware-source/software/firmware" >> "$GITHUB_ENV"
          else
            echo "FIRMWARE_DIR=firmware-source/software" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select production build environment
        run: python .github/scripts/release_workflow.py configure --branch main

      - name: Verify requested source version
        run: |
          test "$(python software/scripts/release_version.py read --header "$FIRMWARE_DIR/src/constants/Version.h")" = "${{ inputs.version }}"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build and verify bridge
        run: |
          pio run --project-dir "$FIRMWARE_DIR" -e migration-production -j 1
          python .github/scripts/check_firmware_size.py \
            --environment migration-production \
            --partition "$FIRMWARE_DIR/partition-v1.csv" \
            --partition-binary "$FIRMWARE_DIR/.pio/build/migration-production/partitions.bin" \
            --firmware "$FIRMWARE_DIR/.pio/build/migration-production/firmware.bin" \
            --expected-partition-blob 62778131c63221bcb0433e31ea5cde8eedc815f6 \
            --expected-partition-binary-sha256 148b959cbff1c38aa8e1d5c0ba9d612c54997b945e56a63f41223eef650653a1
          python .github/scripts/check_migration_image.py \
            --expected-flash-size-bytes 16777216 \
            "$FIRMWARE_DIR/.pio/build/migration-production/firmware.bin"

      - name: Publish validating migration bridge
        run: |
          python .github/scripts/publish_immutable_firmware.py \
            --device-type dtt \
            --hardware-variant v2 \
            --track main \
            --build-sha "$RELEASE_BUILD_SHA" \
            --version-file "$FIRMWARE_DIR/src/constants/Version.h" \
            --kind migration \
            --min-flash-size-bytes 16777216 \
            --partition-layout legacy-v1 \
            --artifact "partitions:$FIRMWARE_DIR/.pio/build/migration-production/partitions.bin:1:false" \
            --artifact "application:$FIRMWARE_DIR/.pio/build/migration-production/firmware.bin:2:true" \
            --artifact "bootloader:$FIRMWARE_DIR/.pio/build/migration-production/bootloader.bin:3:false"
